backup_dir_local: ~/ship-backups
servers:
  prod:
    host: ops@203.0.113.10
    admin_user: ops
    arch: linux/amd64
    caddy_image: caddy:2.10-alpine
    apps:
      lewbox:
        domains: [cloud.lewbox.com, dev.lewbox.com]
        upstream: lewbox:8080
        source:
          type: github-release
          repo: harlew-dev/lewbox
        uid: 10001
        backup:
          sqlite: [/srv/lewbox/lewbox.db]
      lewbox-commerce:
        domains: [lewbox.com]
        redirects: [www.lewbox.com]
        upstream: lewbox-commerce:3000
        source:
          type: image
          path: ~/code/lewbox-commerce
        backup: {}
