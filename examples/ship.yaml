# Example ship.yaml. This file is machine-specific: it only holds how to reach
# each server and where image app checkouts live on this machine.
#
# App records, compose files and Dockerfiles live on the server. Create them
# with `ship <server> app create <app>`, then `ship <server> config edit <app>
# compose` and `ship <server> deploy <app>`. Migrate an old full-format file
# once per server with `ship <server> config push`. Keep secrets in
# /opt/apps/<app>/.env on each server (ship <server> env edit <app>).

# `ship <server> backup` downloads archives here, under <server>/<app>/.
backup_dir_local: ~/backups/vps

servers:
  prod:
    # For the first `ship prod setup`, use root@<ip>, then switch to the
    # admin user and run `ship prod lock-ssh`.
    host: ops@203.0.113.10
    # Optional: the private key for this server. Without it, ssh uses your
    # ssh config and agent.
    identity_file: ~/.ssh/id_ed25519
    # Local checkouts for image apps built on this machine. Never uploaded.
    sources:
      web: ~/code/web

    # admin_user and caddy_image are server settings, not local keys:
    #   ship prod server set admin_user ops
    #   ship prod server set caddy_image caddy:2.10-alpine

  staging:
    host: ops@203.0.113.20
    # The same app can use a different local checkout on each machine.
    sources:
      web: ~/code/web-staging

  # Run ship on the server itself. There is no host or identity_file; user is
  # the optional admin user to act as. See docs/guides/run-on-the-server.md.
  # self:
  #   connection: local
  #   user: ops
  #   sources:
  #     web: /srv/code/web
